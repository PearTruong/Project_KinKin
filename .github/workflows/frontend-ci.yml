name: Frontend CI

on:
  pull_request:
    branches:
      - feat/fe-01-foundation
      - main
  push:
    branches:
      - feat/fe-01-foundation

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web-typecheck-build
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout without large report files
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check PR whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/$BASE_REF...HEAD"

      - name: Typecheck web
        run: pnpm --filter web typecheck

      - name: Build web
        run: pnpm --filter web build
