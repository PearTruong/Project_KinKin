services:
  db:
    image: postgres:17-alpine
    container_name: kinkin-pos-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kinkin_demo
      POSTGRES_USER: kinkin
      POSTGRES_PASSWORD: kinkin
    ports:
      - "5432:5432"
    volumes:
      - kinkin_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinkin -d kinkin_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kinkin_demo_data:
